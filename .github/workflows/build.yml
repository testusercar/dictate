name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/Dictate.Core.Tests --logger "console;verbosity=normal"

  key-spike:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: microsoft/setup-msbuild@v2

      # Throwaway certificate per run; only its public .cer is published.
      - name: Create signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Dictate Dev' -KeyUsage DigitalSignature `
            -FriendlyName 'Dictate Dev' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\dev.pfx" `
            -Password (ConvertTo-SecureString 'ci' -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath out\Dictate-Dev.cer | Out-Null

      - name: Build MSIX
        shell: pwsh
        run: |
          $rid = 'win-' + '${{ matrix.platform }}'.ToLower()
          msbuild src\Dictate.KeySpike\Dictate.KeySpike.csproj /restore /m `
            /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:RuntimeIdentifier=$rid `
            /p:GenerateAppxPackageOnBuild=true /p:AppxPackageDir="$PWD\out\" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\dev.pfx" `
            /p:PackageCertificatePassword=ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts\Install.ps1 out\
          Get-ChildItem -Recurse out | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: dictate-key-spike-${{ matrix.platform }}
          path: out/
