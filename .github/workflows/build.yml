name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/Dictate.Core.Tests --logger "console;verbosity=normal"

  app:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
        # Dictate is the full app; Flow Key is the small helper that drives Wispr Flow from the Copilot key.
        project: [Dictate, FlowKey]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: microsoft/setup-msbuild@v2

      # Throwaway certificate per run, used from the user store by thumbprint; only its public .cer is published.
      - name: Create signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Dictate Dev' -KeyUsage DigitalSignature `
            -FriendlyName 'Dictate Dev' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath out\Dictate-Dev.cer | Out-Null
          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # Every build gets a higher version so it installs over the previous one.
      - name: Stamp package version
        shell: pwsh
        run: |
          $path = 'src\${{ matrix.project }}\Package.appxmanifest'
          [xml]$manifest = Get-Content $path
          $manifest.Package.Identity.Version = "0.2.${{ github.run_number }}.0"
          $manifest.Save((Resolve-Path $path).Path)

      - name: Build MSIX
        shell: pwsh
        run: |
          $rid = 'win-' + '${{ matrix.platform }}'.ToLower()
          msbuild src\${{ matrix.project }}\${{ matrix.project }}.csproj /restore /m `
            /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:RuntimeIdentifier=$rid `
            /p:GenerateAppxPackageOnBuild=true /p:AppxPackageDir="$PWD\out\" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateThumbprint=$env:SIGNING_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts\${{ matrix.project == 'FlowKey' && 'Install-FlowKey.ps1' || 'Install.ps1' }} out\
          Get-ChildItem -Recurse out | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project == 'FlowKey' && 'flowkey' || 'dictate' }}-${{ matrix.platform }}
          path: out/
